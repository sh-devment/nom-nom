name: Deploy

on:
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ matrix.region }}
    runs-on: [self-hosted, "production-${{ matrix.region }}"]
    environment: production-${{ matrix.region }}

    strategy:
      fail-fast: false
      matrix:
        region: [com, ru]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy
        env:
          # Имя приложения: repo-level variable, задаётся вручную (обязательно).
          APP: ${{ vars.APP }}
          # Какие переменные записать в $APP.env (всё ниже в этом блоке).
          ENV_KEYS: REGION PORT AUTH_URL AUTH_INTERNAL APP_URL APP_TOKEN SECRET_KEY AI_PROVIDER AI_MODEL AI_KEY AI_GATEWAY_URL AI_GATEWAY_TOKEN FREE_SCANS

          # Регион наследуется из matrix — отдельно заводить не нужно.
          REGION: ${{ matrix.region }}
          PORT: ${{ vars.PORT }}
          AUTH_URL: ${{ vars.AUTH_URL }}
          AUTH_INTERNAL: ${{ vars.AUTH_INTERNAL }}
          APP_URL: ${{ vars.APP_URL }}
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          # ИИ: у каждого региона свой провайдер/модель/ключ (пока только gemini).
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_KEY: ${{ secrets.AI_KEY }}
          # Все запросы к ИИ идут через Cloudflare AI Gateway (Google режет часть IP по геолокации).
          AI_GATEWAY_URL: ${{ vars.AI_GATEWAY_URL }}
          AI_GATEWAY_TOKEN: ${{ secrets.AI_GATEWAY_TOKEN }}
          FREE_SCANS: ${{ vars.FREE_SCANS }}
        run: ./bin/deploy.sh
